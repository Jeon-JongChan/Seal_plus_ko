// 원본 폴더의 이전 확장 API용 테스트를 수정하지 않고 플러그인 테스트만 컴파일합니다.
gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app != null) {
        // Android 플러그인이 기본 java 경로를 추가한 뒤 최종 컴파일 입력을 제한합니다.
        gradle.taskGraph.whenReady {
            app.tasks.matching { it.name.startsWith('compileGeneric') && it.name.endsWith('AndroidTestKotlin') }.each {
                it.getSourceFileFilter().exclude('**/com/junkfood/**')
                it.doFirst {
                    assert !it.sources.files.any { file -> file.path.replace('\\', '/').contains('/com/junkfood/') }
                }
            }
        }
    }
}
